services:
  app:
    image: anevich/lab33-app:1.0.0
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    depends_on:
      - redis
      - postgres
    networks: [lab-net]

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks: [lab-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lab33
      POSTGRES_USER: lab33
      POSTGRES_PASSWORD: lab33pass
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [lab-net]

networks:
  lab-net:
    driver: bridge

volumes:
  redis-data:
  pg-data:
